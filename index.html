<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - e-Learning Platform</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      padding: 2rem;
    }
    
    .login-card {
      max-width: 450px;
      width: 100%;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.5rem;
    }
    
    .role-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .role-option {
      flex: 1;
      padding: 1rem;
      border: 2px solid #E9ECEF;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .role-option:hover {
      border-color: var(--primary-color);
      background-color: rgba(74, 144, 226, 0.05);
    }
    
    .role-option.active {
      border-color: var(--primary-color);
      background-color: rgba(74, 144, 226, 0.1);
      color: var(--primary-color);
    }
    
    .role-option i {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    
    .quick-links {
      text-align: center;
      margin-top: 1.5rem;
    }
    
    .quick-links a {
      color: var(--primary-color);
      text-decoration: none;
      margin: 0 0.5rem;
    }
    
    .quick-links a:hover {
      text-decoration: underline;
    }
    
    .features-list {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      color: var(--gray-color);
    }
    
    .feature-item i {
      color: var(--secondary-color);
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="card">
        <div class="card-body" style="padding: 2.5rem;">
          <div class="login-header">
            <div class="login-logo">
              <i class="bi bi-book"></i>
            </div>
            <h3>ยินดีต้อนรับ</h3>
            <p class="text-muted">เข้าสู่ระบบ e-Learning Platform</p>
          </div>

          <div class="role-selector">
            <div class="role-option active" data-role="learner">
              <i class="bi bi-person"></i>
              <div class="fw-semibold">ผู้เรียน</div>
            </div>
            <div class="role-option" data-role="admin">
              <i class="bi bi-shield-check"></i>
              <div class="fw-semibold">ผู้ดูแลระบบ</div>
            </div>
          </div>

          <form data-validate="true" id="loginForm">
            <div class="form-group">
              <label class="form-label">อีเมลหรือชื่อผู้ใช้ <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
              <label class="form-label">รหัสผ่าน <span class="text-danger">*</span></label>
              <div class="position-relative">
                <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
              </div>
            </div>

            <div class="form-group">
              <div class="d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">
                    จดจำฉัน
                  </label>
                </div>
                <a href="#" class="text-primary text-decoration-none">ลืมรหัสผ่าน?</a>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
              <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
            </button>

            <div class="text-center">
              <span class="text-muted">ยังไม่มีบัญชี?</span>
              <a href="#" class="text-primary text-decoration-none fw-semibold ms-1">สมัครสมาชิก</a>
            </div>
          </form>

          <div class="features-list">
            <div class="feature-item">
              <i class="bi bi-check-circle-fill"></i>
              <span>เรียนรู้ออนไลน์ทุกที่ทุกเวลา</span>
            </div>
            <div class="feature-item">
              <i class="bi bi-check-circle-fill"></i>
              <span>คอร์สคุณภาพจากผู้เชี่ยวชาญ</span>
            </div>
            <div class="feature-item">
              <i class="bi bi-check-circle-fill"></i>
              <span>ใบประกาศนียบัตรรับรองมาตรฐาน</span>
            </div>
          </div>
        </div>
      </div>

      <div class="quick-links">
        <a href="learner-dashboard.html">
          <i class="bi bi-person-circle"></i> Demo Learner
        </a>
        <span class="text-muted">|</span>
        <a href="admin-dashboard.html">
          <i class="bi bi-shield-check"></i> Demo Admin
        </a>
        <span class="text-muted">|</span>
        <a href="components-demo.html">
          <i class="bi bi-building"></i> Components
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    const roleOptions = document.querySelectorAll('.role-option');
    const loginForm = document.getElementById('loginForm');
    let selectedRole = 'learner';

    roleOptions.forEach(option => {
      option.addEventListener('click', function() {
        roleOptions.forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');
        selectedRole = this.getAttribute('data-role');
      });
    });

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (selectedRole === 'learner') {
        window.location.href = 'learner-dashboard.html';
      } else {
        window.location.href = 'admin-dashboard.html';
      }
    });
  </script>
</body>
</html>
